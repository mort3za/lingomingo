# Home page and privacy policy on GitHub Pages. The privacy page is PRIVACY.md.
name: Pages

on:
  push:
    branches: [main]
    paths: [PRIVACY.md, site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Front matter, so Jekyll makes privacy.html with the site layout.
      - run: "{ printf -- '---\\ntitle: Privacy policy\\n---\\n'; cat PRIVACY.md; } > site/privacy.md"
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
