# Runs only when a version tag (v1.2.3) is pushed. Normal pushes do not start it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout replaces an annotated tag with a lightweight one.
      # Fetch the real tag again, so that the tag message is available.
      - run: git fetch --force origin "$GITHUB_REF:$GITHUB_REF"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # The manifest version comes from package.json, so the tag must match it.
      - name: Check tag matches package.json version
        run: |
          version="$(jq -r .version package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      # The GPL text must ship with the extension. Third-party licenses come from public/.
      - name: Zip dist
        run: cp LICENSE dist/ && cd dist && zip -r "../lingomingo-$GITHUB_REF_NAME.zip" .

      # The Chrome Web Store uses verified CRX uploads: the crx must be signed with the key whose
      # public key is in the dashboard. The private key is the CRX_KEY secret (PEM text).
      # Chrome needs a display to pack, so it runs under xvfb. Chrome writes dist.crx next to dist.
      - name: Sign crx
        env:
          CRX_KEY: ${{ secrets.CRX_KEY }}
        run: |
          if [ -z "$CRX_KEY" ]; then
            echo "::error::Secret CRX_KEY is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/crx-key.pem"
          printf '%s\n' "$CRX_KEY" > "$key"
          xvfb-run -a google-chrome --user-data-dir="$RUNNER_TEMP/chrome-profile" --no-message-box \
            --pack-extension="$PWD/dist" --pack-extension-key="$key"
          rm "$key"
          mv dist.crx "lingomingo-$GITHUB_REF_NAME.crx"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "lingomingo-$GITHUB_REF_NAME.zip" "lingomingo-$GITHUB_REF_NAME.crx" \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
